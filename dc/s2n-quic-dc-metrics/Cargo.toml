[package]
name = "s2n-quic-dc-metrics"
version = "0.76.0"
description = "Crate used to generate metrics for s2n-quic-dc"
repository = "https://github.com/aws/s2n-quic"
authors = ["AWS s2n"]
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
autobenches = false

[features]
# Opt-in Arrow export backend. Off by default: `arrow` is a heavy dependency and most consumers
# only need the querylog/statsd backends. Enabling this pulls in `arrow` and unlocks
# `backend::ArrowBackend`, which accumulates records into an `arrow::RecordBatch` that the caller
# serializes to Parquet (owning the writer + file rotation itself).
arrow = ["dep:arrow"]

[dependencies]
# Kept at the same major version `xtask` uses so the produced schema/RecordBatch interoperate.
arrow = { version = "54", default-features = false, optional = true }
futures-util = "0.3.26"
serde_json = "1"
pin-project-lite = "0.2.9"
tokio = { version = "1.25.0", default-features = false, features = ["rt", "rt-multi-thread", "net", "time"] }
chrono = { version = "0.4.39", default-features = false, features = ["std", "now"] }
libc = "0.2.170"
crossbeam-queue = "0.3.12"
# Provides a stable, lock-free 128-bit atomic (std's `AtomicU128` is still unstable). We use it for
# a tagged (pointer, generation) CAS on the SPMC `empty_pages` stack to defeat the ABA hazard in
# `pop`. It lowers to a single `casp` (aarch64 LSE) / `cmpxchg16b` (x86_64) — the same instruction
# family the rseq fast path already requires.
#
# The default `fallback` feature is REQUIRED, not optional cruft: `AtomicU128` is only exported when
# it is enabled, EXCEPT on targets whose 128-bit CAS is guaranteed by a compile-time `target_feature`
# (e.g. x86_64 only lists `cmpxchg16b` when built with `-Ctarget-feature=+cmpxchg16b` or a `target-cpu`).
# Stock `x86_64-unknown-linux-gnu` does not, so `default-features = false` makes `AtomicU128` vanish
# there (`E0432 no AtomicU128 in the root`). With `fallback` on it is unconditionally available and
# still lock-free on every CPU we run on.
portable-atomic = "1"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(tokio_unstable)']

[[bench]]
name = "bench"
path = "benches/main.rs"
harness = false

[dev-dependencies]
arrow = { version = "54", default-features = false }
criterion = "0.8"
