target = "rendered/0007-recovery/04-congestion-control.md#DC-0007-027"

[[spec]]
level = "MUST"
quote = "Except while it is starting up, a sender MUST lower a limit that caps its window, and that never caps it below the sender's minimum window, within the round trip after one in which the peer's count of packets marked congestion experienced increased, unless the sender was probing for more bandwidth in that round trip and the marked packets, each counted at the path's maximum datagram size, made up at most half of the data delivered in it."
