target = "rendered/0007-recovery/04-congestion-control.md#DC-0007-027"

[[spec]]
level = "MUST"
quote = "A sender MUST lower its window within the round trip after one in which the peer's count of packets marked congestion experienced increased, unless the sender was probing for more bandwidth in that round trip and the marked packets, each counted at the path's maximum datagram size, made up at most half of the data delivered in it."
