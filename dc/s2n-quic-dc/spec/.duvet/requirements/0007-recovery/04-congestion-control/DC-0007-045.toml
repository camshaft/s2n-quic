target = "rendered/0007-recovery/04-congestion-control.md#DC-0007-045"

[[spec]]
level = "MUST"
quote = "On an acknowledgement that ends a probe as DC-0007-044 describes, unless the sender had no application data queued when it sent the newest packet that acknowledgement acknowledges, the sender MUST set a limit that caps its window, and that never caps it below the sender's minimum window, to the larger of the data it had sent and not yet seen acknowledged when it sent that packet and seven tenths of the smaller of its window and its estimate of the path's bandwidth-delay product."
