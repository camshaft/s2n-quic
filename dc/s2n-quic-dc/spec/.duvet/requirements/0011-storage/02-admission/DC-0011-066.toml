target = "rendered/0011-storage/02-admission.md#DC-0011-066"

[[spec]]
level = "MUST"
quote = "When an operation for which DC-0011-064 raised its pool's capacity leaves the pool without the raise of DC-0011-058, the device MUST lower the pool's capacity to the larger of the capacity the pool held just before that raise and the largest cost among the waiting operations that DC-0011-046 counts, where the capacity is higher than that value."
