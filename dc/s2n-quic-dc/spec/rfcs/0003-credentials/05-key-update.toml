[section]
anchor = "key-update"
title = "Key update"
problem = "AES-GCM's confidentiality and integrity bounds limit how many packets one key can protect, and a long-lived stream would pass them."
motivation = "A chain of key-update secrets lets each endpoint move to a fresh key after a fixed number of packets, without a new handshake, and without a disclosed key exposing the keys after it."
prose = "Each direction of a bidirectional stream holds a key-update secret beside its key. An update expands that secret into the next key-update secret, the next key and the next IV. A one-bit key phase in each packet says which key sealed it, and alternates at each update."

[[requirement]]
id = "DC-0003-036"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A key update MUST expand the current key-update secret, used as the pseudorandom key, with an info input of the output length followed by the label `ku`."
rationale = "Each step derives from the previous key-update secret alone, so a disclosed key doesn't disclose the keys after it."

[[requirement]]
id = "DC-0003-037"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "The output of a key update MUST be read, in order, as the next key-update secret and the next key, each of the ciphersuite's key length, and the next 12-byte IV."
rationale = "Both endpoints split the output the same way, with the secret that protects later keys first."

[[requirement]]
id = "DC-0003-038"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A sender MUST update its sealing key once it has sealed 2^23 - 2^16 packets with it."
rationale = "The confidentiality limit of AES-GCM is 2^23 packets under one key, and updating 2^16 packets earlier keeps the packets still in flight under the limit."

[[requirement]]
id = "DC-0003-039"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A sender MUST mark each packet with the key phase, 0 or 1, of the key that sealed it, and switch to the other phase at each update."
rationale = "One bit tells the receiver which of two keys to try, without a key number in each packet."

[[requirement]]
id = "DC-0003-040"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A receiver MUST keep an opening key for each of the two key phases."
rationale = "Packets sealed before and after an update can arrive out of order, and the receiver opens both."

[[requirement]]
id = "DC-0003-041"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A receiver that opens a packet of the phase it doesn't expect MUST then replace that phase's key with the next key of its chain and expect the other phase."
rationale = "The packet shows that the sender updated, so the receiver moves forward, while it keeps the key of the phase whose packets may still arrive."

[[requirement]]
id = "DC-0003-042"
level = "MUST"
polarity = "forbidden"
binds_to = "system"
statement = "An endpoint MUST NOT open a packet of key phase 1 with a key that has no key-update secret."
rationale = "A key without a chain, such as a unidirectional application key, never moves to a next key, so a packet that claims a later phase wasn't sealed by its peer's current key."
