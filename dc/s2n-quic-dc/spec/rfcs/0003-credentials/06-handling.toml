[section]
anchor = "handling"
title = "Handling keys and opened data"
problem = "Key material left in memory, a key used twice where the protocol expects one use, or a payload released before its replay check would let an attacker recover secrets or replay data."
motivation = "Clearing key material, enforcing single use and releasing a payload only after its checks keep a successful attack on one packet from becoming an attack on the path."
prose = "Some keys protect one packet alone, such as the key of a single datagram. An opened payload is released only after the replay check that RFC 0002 states accepts it."

[[requirement]]
id = "DC-0003-043"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "An endpoint MUST overwrite each secret, key-update secret, key and IV with zeros when it stops using it."
rationale = "Key material left in released memory could be read later through another part of the process or a memory disclosure."

[[requirement]]
id = "DC-0003-044"
level = "MUST"
polarity = "forbidden"
binds_to = "system"
statement = "A single-use key MUST NOT seal more than one packet."
rationale = "A key meant for one packet keeps its nonce from repeating only where it seals one packet."

[[requirement]]
id = "DC-0003-045"
level = "MUST"
polarity = "forbidden"
binds_to = "system"
statement = "A single-use key MUST NOT open more than one packet."
rationale = "A second packet opened with a single-use key would be a replay of the first."

[[requirement]]
id = "DC-0003-046"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A receiver MUST check an opened packet against replay protection after the AEAD verifies its tag and before it releases the payload."
rationale = "A forged packet checked for replay before its tag could fill the replay record with false entries, and a payload released before the check could be a replay."

[[requirement]]
id = "DC-0003-047"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A receiver whose replay check refuses an opened packet MUST overwrite the packet's decrypted payload with zeros."
rationale = "The plaintext of a replayed packet then stays out of the buffers a later reader could see."

[[requirement]]
id = "DC-0003-048"
level = "MUST"
polarity = "forbidden"
binds_to = "system"
statement = "An endpoint MUST NOT skip the replay check unless its operator turns the check off through a setting that is named as unsafe."
rationale = "A check that is easy to turn off by mistake protects nothing, so turning it off takes a choice that names its risk."
