[section]
anchor = "control"
title = "Control packets"
problem = "A stream's receiver has to tell its sender which packets arrived, and a sender that couldn't check those reports, or route them to the right stream, couldn't recover lost data."
motivation = "A control packet carries QUIC frames, such as acknowledgments, authenticated with the path's keys, and its optional fields name the stream and the queue it answers."
prose = "A control packet carries control frames from a stream's receiver to its sender: its tag's flags, its credentials and wire version, the stream identifier where it answers one stream, an optional source queue identifier, the packet number, the control data length, optional routing information, the control data and the authentication tag. The control data isn't encrypted; the authentication tag covers the whole packet."

[[requirement]]
id = "DC-0004-036"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "In a control packet's tag, bit 0x08 MUST be set exactly when the packet carries a source queue identifier, bit 0x04 when it carries the identifier of the stream it answers, and bit 0x02 when it carries routing information."
rationale = "Each optional field is present only where the tag says so."

[[requirement]]
id = "DC-0004-037"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A sender MUST set bit 0x01 of a control packet's tag to zero."
rationale = "The bit has no meaning yet, and zero keeps it free for a later version."

[[requirement]]
id = "DC-0004-038"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A control packet's fields MUST appear in this order: the tag, the credentials, the wire version, the stream identifier, the source queue identifier, the packet number, the control data length, the routing information, the control data and the authentication tag, each optional field only where its condition holds."
rationale = "A fixed order lets a receiver read each field without a marker for it."

[[requirement]]
id = "DC-0004-039"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "The stream identifier, source queue identifier, packet number and control data length of a control packet MUST be variable-length integers, the stream identifier encoded as a stream packet's is."
rationale = "One encoding of the stream identifier names the same stream in stream and control packets."

[[requirement]]
id = "DC-0004-040"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "The control data of a control packet MUST be a sequence of QUIC frames."
rationale = "Acknowledgments and other control information reuse the frames QUIC defines."

[[requirement]]
id = "DC-0004-041"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A control packet MUST be authenticated and not encrypted: its authentication tag covers every byte from the packet's tag to the end of its control data, with the packet number as nonce and key phase zero."
rationale = "The control data holds no secret, so authentication alone keeps it from being forged."

[[requirement]]
id = "DC-0004-042"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "The routing information of a control packet MUST be a routing type of 0 followed by the source sender identifier and the destination sender identifier, each a variable-length integer."
rationale = "The two identifiers route the reply back to the sender that sent the data it answers."

[[requirement]]
id = "DC-0004-043"
level = "MUST"
polarity = "forbidden"
binds_to = "system"
statement = "A receiver MUST NOT accept a control packet whose routing type is other than 0."
rationale = "A receiver can't route a packet by a scheme it doesn't know."
