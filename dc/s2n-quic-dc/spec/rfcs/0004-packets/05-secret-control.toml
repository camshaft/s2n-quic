[section]
anchor = "secret-control"
title = "Secret control packets"
problem = "A peer that has lost a path secret, sees a stale key or a replayed packet, or can't route a packet to a queue, has to tell the sender, and a forged notice of that kind would let anyone tear down a path."
motivation = "Small packets with fixed layouts let a receiver answer at once, and each is authenticated: by a message authentication code under the path's control secret, or, for an unknown path secret, by a stateless reset token that only the secret's holder knows."
prose = "Four secret control packets report a problem with a path: an unknown path secret packet, a stale key packet, a replay detected packet and a queue reset packet. Each starts with its tag, a credential identifier or the credentials, and the wire version, and three of them can carry the identifier of the queue that is to receive them. Each ends with a 16-byte tag, and no secret control packet is longer than 64 bytes."

[[requirement]]
id = "DC-0004-044"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A secret control packet's tag MUST be 0x60 for an unknown path secret packet, 0x61 for a stale key packet, 0x62 for a replay detected packet and 0x67 for a queue reset packet, with bit 0x04 set on the first three exactly when the packet carries a queue identifier."
rationale = "A receiver tells the four notices apart, and finds the queue identifier, from the tag alone."

[[requirement]]
id = "DC-0004-045"
level = "MUST"
polarity = "forbidden"
binds_to = "system"
statement = "A secret control packet MUST NOT be longer than 64 bytes."
rationale = "A small fixed bound lets a receiver read every secret control packet into a small buffer."

[[requirement]]
id = "DC-0004-046"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "The queue identifier, minimum key identifier, rejected key identifier, code and trigger of a secret control packet MUST be variable-length integers."
rationale = "The integers take only the bytes their values need."

[[requirement]]
id = "DC-0004-047"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "An unknown path secret packet MUST hold, in this order, its tag, the credential identifier, the wire version, the queue identifier where the tag's bit 0x04 is set, and the 16-byte stateless reset token of that credential identifier."
rationale = "The packet carries no other field, since a peer without the path secret can't authenticate anything else."

[[requirement]]
id = "DC-0004-048"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A receiver MUST accept an unknown path secret packet only where its last 16 bytes equal the stateless reset token of its credential identifier, compared in constant time."
rationale = "The packet tells a peer that its path secret is gone, so only the holder of the token can send it, and a constant-time comparison doesn't leak the token."

[[requirement]]
id = "DC-0004-049"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A stale key packet MUST hold, in this order, its tag, the credential identifier, the wire version, the sender's queue identifier where the tag's bit 0x04 is set, the minimum key identifier its sender still accepts, and a 16-byte authentication tag."
rationale = "The minimum key identifier tells the peer which keys to skip."

[[requirement]]
id = "DC-0004-050"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A replay detected packet MUST hold, in this order, its tag, the credential identifier, the wire version, the sender's queue identifier where the tag's bit 0x04 is set, the key identifier its sender rejected as a replay, and a 16-byte authentication tag."
rationale = "The rejected key identifier tells the peer which key to stop using."

[[requirement]]
id = "DC-0004-051"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A queue reset packet MUST hold, in this order, its tag, the credentials, the wire version, the queue identifier, a code, the trigger and a 16-byte authentication tag."
rationale = "The credentials and the queue identifier name the queue that couldn't take the packet, and the code says why."

[[requirement]]
id = "DC-0004-052"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "The trigger of a queue reset packet MUST be 0 where an unroutable stream packet caused the reset and 1 where an unroutable control packet caused it."
rationale = "The trigger tells the receiver which half of the stream the reset is for."

[[requirement]]
id = "DC-0004-053"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A receiver MUST read a queue reset trigger other than 0 and 1 as 0."
rationale = "A later version can add trigger values without breaking an older receiver."

[[requirement]]
id = "DC-0004-054"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "The 16-byte authentication tag of a stale key, replay detected or queue reset packet MUST be a message authentication code, under the path's control secret, of every byte before it."
rationale = "Only a holder of the path secret can produce the code, so a forged notice is dropped."
