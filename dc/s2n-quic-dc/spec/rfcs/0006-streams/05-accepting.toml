[section]
anchor = "accepting"
title = "Accepting streams"
problem = "A server needs to hand each incoming stream to the part of the application that serves it, and to keep a slow consumer from holding an unbounded number of streams."
motivation = "Routing by acceptor identifier lets one endpoint serve several services, the queue slots the server grants each client hold new streams back at the client while the application is slow, so the server keeps every stream it accepted, and spreading streams over receivers lets the application scale out."
prose = "A server registers acceptors on its endpoint, each under an identifier. Each incoming stream goes to the acceptor its identifier names, and waits in a receiver's queue until the application takes it. A stream that arrives before any receiver has polled for one or registered to take one is turned away as busy. The application clones a receiver to add workers, and drops every receiver to retire the acceptor. A queue slot is the room the server holds for one stream of one client: the client opens each stream on a slot it holds, each write of the stream names that slot until the server confirms the stream, and the stream keeps its slot until the application has finished with it. The server then returns the freed slot to the client in a frame that names the slot, and the client may open another stream on it. The server starts each client with one slot, doubles the client's grant while its receivers take that client's streams as fast as they arrive, and holds it while streams wait or halves it by keeping freed slots. The memory that waiting streams hold is under pressure while the allocator or pool that holds them refuses or delays room for a stream; while it is, no grant grows and the server keeps freed slots."

[[requirement]]
id = "DC-0006-037"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A server MUST refuse to start where its endpoint and its handshake provider don't share one map of path secrets."
rationale = "Streams would arrive under path secrets the endpoint can't find, so every stream would fail."

[[requirement]]
id = "DC-0006-038"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A server MUST deliver each incoming stream to the acceptor registered under the stream's acceptor identifier."
rationale = "The identifier is how a client picks the service it talks to."

[[requirement]]
id = "DC-0006-039"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A server MUST refuse to register an acceptor under an identifier that is still registered, and report that the identifier is in use."
rationale = "Two acceptors under one identifier would split one service's streams unpredictably, and an identifier stays registered until the server has removed its acceptor."

[[requirement]]
id = "DC-0006-040"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A server MUST let acceptors registered under different identifiers receive streams at the same time."
rationale = "One endpoint can then serve several services."

[[requirement]]
id = "DC-0006-041"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A server MUST reject a stream whose acceptor identifier doesn't name a registered acceptor."
rationale = "The client then learns of its mistake instead of waiting on a stream that nobody reads."

[[requirement]]
id = "DC-0006-057"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "Each receiver of an acceptor MUST keep every stream that waits for it until the application takes the stream or drops the receiver."
rationale = "A stream the server accepted is work it took on, and dropping it because many streams wait would lose that work."

[[requirement]]
id = "DC-0006-058"
level = "MUST"
polarity = "forbidden"
binds_to = "system"
statement = "The server MUST NOT evict a waiting stream from a receiver's queue to make room for a new stream."
rationale = "Eviction would drop a stream the server had already accepted; the queue slots the server grants each client, and not the queue, hold new streams back."

[[requirement]]
id = "DC-0006-059"
level = "MUST"
polarity = "forbidden"
binds_to = "system"
statement = "The server MUST NOT give a client back the credit of a stream until the application has finished with the stream."
rationale = "Each waiting stream then holds the queue slot and the credit its client opened it with, so a slow application holds new streams back at the client, as a reader's window holds back data, and the server's grant of queue slots bounds the streams that wait."

[[requirement]]
id = "DC-0006-060"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "The server MUST set the number of queue slots each client may hold for streams to that server."
rationale = "The server holds each waiting stream, so only the server knows how many its acceptors can keep; a number the client advertises states what the client grants, and not what the server can hold."

[[requirement]]
id = "DC-0006-061"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "At the handshake, the server MUST advertise to each client a starting grant of one queue slot."
rationale = "The client can open a stream at once, and the server learns how fast its receivers take that client's streams before it lets the client hold more."

[[requirement]]
id = "DC-0006-062"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "The server MUST derive each client's grant of queue slots from how its acceptors' receivers take that client's streams and from the memory its waiting streams hold, and not from a fixed number."
rationale = "A fixed number is either too small for a fast application or lets a slow one collect more waiting streams than the server can hold; only the rate at which receivers take streams, and the answers of the memory that holds waiting streams, say how many the server can keep."

[[requirement]]
id = "DC-0006-063"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "Where a receiver takes a stream of a client that holds every slot of its grant, no stream of that client waits in any receiver's queue after the take, and the memory waiting streams hold isn't under pressure, the server MUST double that client's grant."
rationale = "The application is then waiting for work while the grant, and not the application, holds the client's streams back; doubling reaches the grant the application keeps up with in a few round trips, where one slot at a time would take one round trip for each slot. The server keeps, for each client, a count of the slots it holds and of its streams that wait, so that each take reads two counts."

[[requirement]]
id = "DC-0006-064"
level = "MUST"
polarity = "forbidden"
binds_to = "system"
statement = "The server MUST NOT grow a client's grant while streams of that client wait in a receiver's queue."
rationale = "Waiting streams show that the application already has more work than it takes, so more slots would only add streams that wait."

[[requirement]]
id = "DC-0006-065"
level = "MAY"
polarity = "required"
binds_to = "system"
statement = "While streams of a client wait in a receiver's queue, the server MAY shrink that client's grant by keeping freed slots instead of returning them to the client, down to half the grant the client held when its streams began to wait, or further where DC-0006-073 asks."
rationale = "A grant that grew while the application was fast then follows the application down when it slows, as fast as it grew."

[[requirement]]
id = "DC-0006-066"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "The server MUST tell a client of each slot it adds to the client's grant by naming that slot in the frame that returns freed slots to the client."
rationale = "One frame then carries every change of the grant, with the retransmission that frame already has, and the client learns of a new slot the way it learns of a freed one."

[[requirement]]
id = "DC-0006-067"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "The client MUST take a slot that the server names as free and that the client hasn't held as a new slot of its grant."
rationale = "A grant then grows without a frame of its own, and a client never opens more streams than the server has granted."

[[requirement]]
id = "DC-0006-068"
level = "MUST"
polarity = "forbidden"
binds_to = "system"
statement = "The client MUST NOT open a stream on a queue slot that the server hasn't granted it."
rationale = "The grant is what holds new streams back at the client while the application is slow."

[[requirement]]
id = "DC-0006-069"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "The server MUST refuse a stream whose first write to reach the server names a queue slot that the server doesn't grant that client."
rationale = "A client that opens past its grant then can't make the server hold more streams than the server granted. Since the server may keep a freed slot instead of returning it (DC-0006-065), the slots a client holds are a set and not every slot up to the highest one granted, so the server tests whether the named slot is one of the slots it grants that client, and not whether the slot's number is below a bound, and makes that test before it allocates room for the slot."

[[requirement]]
id = "DC-0006-070"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "The server MUST keep each client's grant of queue slots at one slot or more."
rationale = "A client with no slot can't open a stream, and a grant grows only when a receiver takes one of that client's streams, so a grant of no slots would never grow again."

[[requirement]]
id = "DC-0006-071"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "The server MUST refuse a stream whose first write to reach the server names a queue slot that holds a stream the server hasn't freed."
rationale = "Each slot then holds one stream, so the streams that wait for a client stay within the slots the server granted it."

[[requirement]]
id = "DC-0006-072"
level = "MUST"
polarity = "forbidden"
binds_to = "system"
statement = "While the memory that waiting streams hold is under pressure, the server MUST NOT grow any client's grant."
rationale = "The grants of every client together bound the memory waiting streams hold, so no grant grows while that memory can't take more."

[[requirement]]
id = "DC-0006-073"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "While the memory that waiting streams hold is under pressure, the server MUST keep each freed slot instead of returning it to its client, except the last slot of that client's grant."
rationale = "The sum of the grants then falls as streams finish, until the memory is no longer under pressure, and each client keeps the one slot that lets its grant grow again."

[[requirement]]
id = "DC-0006-045"
level = "SHOULD"
polarity = "required"
binds_to = "system"
statement = "Where an acceptor has several receivers, the server SHOULD give each stream to the less loaded of two receivers it picks at random."
rationale = "Picking the less loaded of two spreads streams evenly across workers at a low cost for each stream."

[[requirement]]
id = "DC-0006-046"
level = "MUST"
polarity = "forbidden"
binds_to = "system"
statement = "The server MUST NOT give streams to a receiver that hasn't yet polled for a stream or registered to take one."
rationale = "Streams sent to a receiver that nobody polls would wait in its queue while other receivers are idle; a receiver that registers says that it is ready to take them."

[[requirement]]
id = "DC-0006-054"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "Where an acceptor has receivers and none of them has polled for a stream or registered to take one, the server MUST reset an incoming stream to that acceptor as busy."
rationale = "The client learns at once that the service isn't ready, instead of waiting on a stream that nobody takes."

[[requirement]]
id = "DC-0006-047"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "Once every receiver of an acceptor is dropped, the server MUST reject streams to the acceptor's identifier."
rationale = "A retired acceptor then stops taking streams at once."

[[requirement]]
id = "DC-0006-056"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "Once a stream to an acceptor finds every receiver of the acceptor dropped, the server MUST remove the acceptor's registration."
rationale = "The retired acceptor's identifier is then free for a new registration once the server has seen that the acceptor is gone."
