[section]
anchor = "signals"
title = "Signals of a pool"
problem = "Without signals, an operator can't tell a pool that is busy from one that leaks credit or one that wedged."
motivation = "Gauges read from the balance of the pool, and counters of each path a request and a pass take, show the pool's state and where its credit goes."
prose = "A pool reports gauges and counters under a prefix its holder sets, such as one prefix for the pool of sending and another for the pool of receiving. Its free credit reads below zero by the backlog of waiting requests, which is load, not an error. Its held credit is the leak signal: a large value under load is healthy, but held credit that stays above zero while traffic is idle and no request waits is credit that left and didn't come back. A gauge is computed when it is read, so a sample can be off by changes made while it is read; the steady value across samples is the signal."

[[requirement]]
id = "DC-0008-046"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A pool MUST report its signals under a prefix its holder sets."
rationale = "Two pools of one endpoint then report apart."

[[requirement]]
id = "DC-0008-047"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A pool MUST report its free credit, which reads below zero by the credit waiting requests are owed."
rationale = "Free credit below zero shows the depth of the backlog."

[[requirement]]
id = "DC-0008-048"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A pool MUST report the credit that waiting requests are owed and haven't been granted."
rationale = "Owed credit shows how much demand waits."

[[requirement]]
id = "DC-0008-049"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A pool MUST report the credit returned by releases and not yet distributed."
rationale = "Returned credit that stays high shows a distribution that doesn't run."

[[requirement]]
id = "DC-0008-050"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A pool MUST report the credit its holders hold, as its capacity less its free, owed and returned credit."
rationale = "Held credit that stays above zero while traffic is idle and no request waits is the sign of a leak."

[[requirement]]
id = "DC-0008-051"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A pool MUST count, at each priority level, the requests it granted at once and the requests that waited."
rationale = "The split shows how often holders of each level wait for credit."

[[requirement]]
id = "DC-0008-052"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A pool MUST count the bytes acquired, the bytes released and the releases made."
rationale = "Bytes acquired and released over a long time show whether holders return what they take."

[[requirement]]
id = "DC-0008-053"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A pool MUST count the distribution's passes, its grants, the cancelled waits it reclaimed, the races of a cancel and a grant, and the turns that ended on their budget."
rationale = "These counts show how the distribution spends its work and where waits end."

[[requirement]]
id = "DC-0008-054"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A pool MUST report the credit a pass held back for the next pass, and count each clamp of its free credit to its capacity."
rationale = "Held-back credit shows the rule against new requests at work, and a clamp shows the refill adding more than releases took."

[[requirement]]
id = "DC-0008-055"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A pool MUST count the bytes the refill added, its ticks that added credit and its ticks that didn't, and report how many ticks in a row added credit."
rationale = "A refill that adds credit tick after tick shows a wedged pool, and a refill that adds nothing shows healthy load."
