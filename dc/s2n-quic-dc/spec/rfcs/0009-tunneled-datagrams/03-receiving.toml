[section]
anchor = "receiving"
title = "Receiving"
problem = "A receiver that acts on a packet it can't authenticate, or on a packet of another kind, hands an attacker's bytes to the application."
motivation = "Checking the first byte before anything else drops packets of the wrong kind cheaply, and opening the payload only under the key the credentials identify keeps every payload the application reads one that a holder of the path secret sealed."
prose = "A receiver decodes a packet from the front of a datagram and leaves the bytes after it for the next packet. It rejects a packet whose first byte doesn't mark a datagram packet, or marks routing information or an application header. It opens the payload with the key the credentials identify, with the packet number as the nonce and the header as associated data, and hands the payload to the application only once the authentication tag verifies."

[[requirement]]
id = "DC-0009-015"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A receiver MUST reject a packet whose first byte doesn't hold 0100 in its high four bits."
rationale = "Only a datagram packet has the layout this RFC defines, so the receiver can't read any other packet's fields."

[[requirement]]
id = "DC-0009-016"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A receiver MUST reject a packet whose routing information bit is set."
rationale = "A packet with routing information is a datagram meant for another component, not a tunneled datagram."

[[requirement]]
id = "DC-0009-017"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A receiver MUST reject a packet whose application header bit is set."
rationale = "A packet whose payload is only partly encrypted isn't a form this RFC defines, so the receiver can't open it as one."

[[requirement]]
id = "DC-0009-018"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A receiver MUST read the last 16 bytes of each packet as its authentication tag."
rationale = "The tag's length isn't written in the packet, so the receiver and the sender agree on it in advance."

[[requirement]]
id = "DC-0009-019"
level = "MUST"
polarity = "forbidden"
binds_to = "system"
statement = "A receiver MUST NOT hand a payload to the application unless the packet's authentication tag verifies over its header and its payload, under the key its credentials identify and with its packet number as the nonce."
rationale = "A payload whose tag doesn't verify could come from anyone, or could have been changed on the way."

[[requirement]]
id = "DC-0009-020"
level = "MAY"
polarity = "required"
binds_to = "system"
statement = "A datagram MAY carry more than one tunneled datagram packet, each starting at the byte after the end of the one before it."
rationale = "Several small payloads can share one datagram, which saves the cost of a send for each."
