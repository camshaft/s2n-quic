[section]
anchor = "replay"
title = "Replay protection"
problem = "An attacker who records a sealed datagram can send it again, and its authentication tag still verifies."
motivation = "A window of the packet numbers a receiver has accepted lets it drop a repeated datagram with fixed memory, at the cost of dropping a datagram that arrives older than the window."
prose = "A receiver keeps a sliding window of the packet numbers it has accepted. A number in the window that the receiver accepted before is a repeat, and a number older than the window's oldest is too old: the receiver rejects both. A number newer than the window's newest moves the window on. The receiver records a number only for a packet whose tag verified."

[[requirement]]
id = "DC-0009-021"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A receiver MUST reject a packet whose packet number it accepted before."
rationale = "A repeated packet number under one key is a replayed or duplicated datagram."

[[requirement]]
id = "DC-0009-022"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A receiver MUST reject a packet whose packet number is older than the oldest number its replay window holds."
rationale = "The receiver no longer knows whether it accepted a number that old, so it can't tell a late datagram from a replayed one."

[[requirement]]
id = "DC-0009-023"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A receiver MUST accept, in its replay check, a packet whose packet number is newer than every number it accepted before."
rationale = "A number that new can't be a repeat, and accepting it moves the window on with the sender."

[[requirement]]
id = "DC-0009-024"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A receiver MUST record a packet number in its replay window only once the packet's authentication tag verifies."
rationale = "An attacker who could record numbers with forged packets could move the window past the sender's numbers and make the receiver reject every real datagram."
